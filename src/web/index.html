<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PTZ Control</title><link rel="stylesheet" href="/styles.css"></head><body><main class="dock">
<header><div class="brand"><div class="brandIcon">PTZ</div><div><strong>PTZ CONTROL</strong><small id="activeName">Nenhuma câmera</small></div></div><div class="headerActions"><button id="theme" class="iconBtn" title="Tema">◐</button><button id="settings" class="iconBtn" title="Configurações">⚙</button></div></header>
<div id="workspace" class="workspace">
<section class="controls"><div class="pad"><button data-move="up-left" title="Cima e esquerda">↖</button><button data-move="up" title="Cima">↑</button><button data-move="up-right" title="Cima e direita">↗</button><button data-move="left" title="Esquerda">←</button><button id="home" class="home" title="Home">⌂</button><button data-move="right" title="Direita">→</button><button data-move="down-left" title="Baixo e esquerda">↙</button><button data-move="down" title="Baixo">↓</button><button data-move="down-right" title="Baixo e direita">↘</button></div>
<div class="speedRow"><span>Velocidade</span><input id="speed" type="range" min="1" max="20" value="8"></div><div class="zoom"><button data-zoom="out" title="Diminuir zoom"><span class="zoomIcon">⌕</span><b>−</b></button><button data-zoom="in" title="Aumentar zoom"><span class="zoomIcon">⌕</span><b>+</b></button></div></section>
<section class="memoryPanel"><div class="sectionTitle"><span>MEMÓRIAS</span><small>clique para chamar • botão direito para editar</small></div><div id="presets" class="presets"></div></section>
</div>
<section class="cameraPanel"><div class="sectionTitle"><span>CÂMERAS</span><small id="cameraCount"></small></div><div id="cameras" class="cameras"></div></section>
<footer><span>Culto em Off</span><button id="about" class="textBtn">Sobre</button></footer>
<dialog id="settingsDialog"><h2>⚙ Configurações</h2><div class="settingGroup"><label>Quantidade de memórias<select id="presetCount"><option>8</option><option>12</option><option>16</option><option>20</option><option>24</option></select></label><label>Posição das memórias<select id="presetPosition"><option value="bottom">Abaixo dos controles (vertical)</option><option value="right">Ao lado dos controles (horizontal)</option></select></label></div><button id="scan" class="primary">⌕ Procurar câmeras na rede</button><button class="close">Fechar</button></dialog>
<dialog id="presetDialog"><h2 id="presetTitle">Memória</h2><input id="presetName" maxlength="24" placeholder="Nome da posição"><div class="dialogActions"><button id="savePosition" class="primary">◆ Salvar posição atual</button><button id="clearPreset" class="danger">× Limpar memória</button></div><button class="close">Cancelar</button></dialog>
<dialog id="aboutDialog"><h2>PTZ Control</h2><p>Controle PTZ para OBS Studio.</p><p><strong>Desenvolvido por Culto em Off</strong></p><p>Versão 0.3.0</p><button class="close">Fechar</button></dialog>
</main><script src="/app.js"></script></body></html>
