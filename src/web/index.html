<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PTZ Control Web</title><link rel="stylesheet" href="/styles.css"></head><body><main class="dock">
<header><div class="brand"><img class="brandLogo" src="/cultoemoff-logo.png" alt="Culto em Off"><div><strong>PTZ CONTROL WEB</strong><small id="activeName"></small></div></div><div class="headerActions"><button id="theme" class="iconBtn">◐</button><button id="settings" class="iconBtn">⚙</button></div></header>
<nav class="languages"><button data-lang="en">EN</button><button data-lang="es">ES</button><button data-lang="pt">PT</button></nav>
<div id="workspace" class="workspace"><section class="controls"><div class="pad"><button data-move="up-left">↖</button><button data-move="up">↑</button><button data-move="up-right">↗</button><button data-move="left">←</button><button id="home" class="home">⌂</button><button data-move="right">→</button><button data-move="down-left">↙</button><button data-move="down">↓</button><button data-move="down-right">↘</button></div><div class="speedRow"><span data-i18n="speed"></span><input id="speed" type="range" min="1" max="20" value="8"></div><div class="zoom"><button data-zoom="out" title="Zoom out"><span class="magnify">⌕</span><b>−</b></button><button data-zoom="in" title="Zoom in"><span class="magnify">⌕</span><b>+</b></button></div></section>
<section class="memoryPanel"><div class="sectionTitle"><span>PRESETS</span><small data-i18n="presetHelp"></small></div><div id="presets" class="presets"></div></section></div>
<section class="cameraPanel"><div class="sectionTitle"><span data-i18n="cameras"></span><small id="cameraCount"></small></div><div id="cameras" class="cameras"></div></section>
<footer><span>Culto em Off</span><button id="about" class="textBtn" data-i18n="about"></button></footer>
<dialog id="settingsDialog"><h2 data-i18n="settings"></h2><div class="tabs"><button class="tab active" data-tab="general" data-i18n="general"></button><button class="tab" data-tab="cameraSettings" data-i18n="cameras"></button></div><section id="general" class="tabPage active"><label><span data-i18n="presetCount"></span><select id="presetCount"><option>8</option><option>12</option><option>16</option><option>20</option><option>24</option></select></label><label><span data-i18n="presetPosition"></span><select id="presetPosition"><option value="bottom" data-i18n="vertical"></option><option value="right" data-i18n="horizontal"></option></select></label></section>
<section id="cameraSettings" class="tabPage"><div class="cameraEditor"><aside><div id="settingsCameraList"></div><button id="newCamera" class="primary" data-i18n="addCamera"></button></aside><div class="cameraForm"><label><span data-i18n="cameraName"></span><input id="camName"></label><label><span data-i18n="technology"></span><select id="camProtocol"><option value="visca-udp">VISCA over IP — UDP</option><option value="visca-tcp">VISCA over IP — TCP</option><option value="onvif">ONVIF</option><option value="ndi">NDI PTZ</option></select></label><label><span data-i18n="host"></span><input id="camHost" placeholder="192.168.1.100"></label><label><span data-i18n="port"></span><input id="camPort" type="number" value="52381"></label><div id="authFields"><label><span data-i18n="user"></span><input id="camUser"></label><label><span data-i18n="password"></span><input id="camPassword" type="password"></label></div><label><span data-i18n="maxSpeed"></span><input id="camMaxSpeed" type="range" min="1" max="20" value="20"></label><label><span data-i18n="cameraPresetCount"></span><input id="camPresetCount" type="number" min="1" max="128" value="24"></label><label class="check"><input id="invertPan" type="checkbox"><span data-i18n="invertPan"></span></label><label class="check"><input id="invertTilt" type="checkbox"><span data-i18n="invertTilt"></span></label><div class="formActions"><button id="scan" data-i18n="scan"></button><button id="saveCamera" class="primary" data-i18n="saveCamera"></button></div></div></div></section><button class="close" data-i18n="close"></button></dialog>
<dialog id="presetDialog"><h2 id="presetTitle"></h2><input id="presetName" maxlength="24"><div class="dialogActions"><button id="savePosition" class="primary" data-i18n="savePosition"></button><button id="clearPreset" class="danger" data-i18n="clearPreset"></button></div><button class="close" data-i18n="cancel"></button></dialog>
<dialog id="aboutDialog"><h2>PTZ Control Web</h2><p data-i18n="aboutText"></p><p data-i18n="shareText"></p><div class="socials"><a href="https://www.instagram.com/cultoemoff/" target="_blank">Instagram</a><a href="https://www.youtube.com/@CultoemOff" target="_blank">YouTube</a><button id="sharePlugin" data-i18n="share"></button></div><p class="version">v0.4.0 • Culto em Off</p><button class="close" data-i18n="close"></button></dialog>
</main><script src="/app.js"></script></body></html>
