<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PTZ Control Web</title><link rel="stylesheet" href="/styles.css"></head><body><main class="dock">
<header><div class="brand"><div><strong>PTZ CONTROL WEB</strong><small id="activeName"></small></div></div><button id="settings" class="iconBtn" title="Settings">⚙</button></header>
<div id="workspace" class="workspace"><section class="controls"><div class="pad"><button data-move="up-left">↖</button><button data-move="up">↑</button><button data-move="up-right">↗</button><button data-move="left">←</button><button id="home" class="home" title="Home">⌂</button><button data-move="right">→</button><button data-move="down-left">↙</button><button data-move="down">↓</button><button data-move="down-right">↘</button></div><div class="speedRow"><span data-i18n="speed"></span><input id="speed" type="range" min="1" max="20" value="8"></div>
<div class="toolLabel">ZOOM</div><div class="zoom"><button data-zoom="out" title="Zoom out"><span class="lens">⌕</span><b>−</b></button><button data-zoom="in" title="Zoom in"><span class="lens">⌕</span><b>+</b></button></div>
<div class="toolLabel" data-i18n="focus"></div><div class="focus"><button id="autoFocus" title="Auto focus"><span class="focusIcon">◎</span><small>AUTO</small></button><button data-focus="near" title="Focus near"><span class="focusIcon">◁|</span><small>NEAR</small></button><button data-focus="far" title="Focus far"><span class="focusIcon">|▷</span><small>FAR</small></button></div></section>
<section class="memoryPanel"><div class="sectionTitle"><span>PRESETS</span><small data-i18n="presetHelp"></small></div><div id="presets" class="presets"></div></section></div>
<section class="cameraPanel"><div class="sectionTitle"><span data-i18n="cameras"></span><small id="cameraCount"></small></div><div id="cameras" class="cameras"></div></section><footer><span>Jonas - Culto em Off - PTZ Control Web</span></footer>
<dialog id="settingsDialog"><div class="settingsHead"><div><small>PTZ CONTROL WEB</small><h2 data-i18n="settings"></h2></div><button class="closeX">×</button></div><div class="settingsNav"><button class="navCard active" data-page="general"><b>⚙</b><span data-i18n="general"></span></button><button class="navCard" data-page="cameraSettings"><b>▣</b><span data-i18n="cameras"></span></button><button class="navCard" data-page="aboutSettings"><b>ⓘ</b><span data-i18n="about"></span></button></div>
<section id="general" class="settingsPage active"><div class="settingsGrid"><article class="settingCard"><h3 data-i18n="language"></h3><select id="language"><option value="pt">Português</option><option value="en">English</option><option value="es">Español</option><option value="de">Deutsch</option></select></article><article class="settingCard"><h3 data-i18n="appearance"></h3><select id="themeSelect"><option value="dark" data-i18n="themeDark"></option><option value="light" data-i18n="themeLight"></option></select></article><article class="settingCard"><h3>Presets</h3><label><span data-i18n="presetCount"></span><select id="presetCount"><option>8</option><option>12</option><option>16</option><option>20</option><option>24</option></select></label></article><article class="settingCard controlsSetting"><h3 data-i18n="controls"></h3><label class="switchRow"><span data-i18n="showControls"></span><input id="showControls" type="checkbox" checked></label><p class="settingHelp" data-i18n="showControlsHelp"></p></article><article class="settingCard gamepadSetting"><h3 data-i18n="gamepad"></h3><label class="switchRow"><span data-i18n="enableGamepad"></span><input id="enableGamepad" type="checkbox"></label><p id="gamepadStatus" class="settingHelp"></p></article><article id="gamepadMap" class="settingCard gamepadMap hidden"><h3 data-i18n="gamepadMap"></h3><div class="controllerMap"><div class="controllerDrawing"><div class="shoulder lt">LT<small>Zoom −</small></div><div class="shoulder lb">LB<small>NEAR</small></div><div class="shoulder rb">RB<small>FAR</small></div><div class="shoulder rt">RT<small>Zoom +</small></div><div class="controllerShell"><div class="stickDraw leftStick">●<small>Pan / Tilt</small></div><div class="dpadDraw"><b>✚</b><small data-i18n="mapPresetSelect"></small></div><div class="centerControls"><i></i><i></i></div><div class="faceButtons"><span class="yFace">Y</span><span class="xFace">X</span><small class="autoLabel">AUTO</small><span class="bFace">B</span><span class="aFace">A</span><small class="saveLabel" data-i18n="mapSave"></small><small class="recallLabel" data-i18n="mapRecall"></small></div><div class="stickDraw rightStick">●<small data-i18n="mapSpeed"></small></div></div></div></div></article><article class="settingCard"><h3 data-i18n="layout"></h3><select id="presetPosition"><option value="bottom" data-i18n="vertical"></option><option value="right" data-i18n="horizontal"></option></select></article></div></section>
<section id="cameraSettings" class="settingsPage"><div class="cameraCardsHead"><div><h3 data-i18n="cameraManagement"></h3><small data-i18n="cameraManagementHelp"></small></div><div><button id="newCamera" class="primary" data-i18n="addCamera"></button></div></div><div id="settingsCameraList" class="settingsCameraList"></div><div id="cameraForm" class="cameraForm hidden"><div class="formGrid"><label><span data-i18n="cameraName"></span><input id="camName"></label><label><span data-i18n="technology"></span><select id="camProtocol"><option value="visca-udp">VISCA over IP — UDP</option><option value="visca-tcp">VISCA over IP — TCP</option><option value="onvif">ONVIF</option><option value="visca-serial">VISCA USB / Serial</option></select></label><div id="discoveryBox" class="discoveryBox hidden"><span data-i18n="discoveryHelp"></span><button id="scan" data-i18n="scan"></button></div><label><span data-i18n="host"></span><input id="camHost" placeholder="192.168.1.100"></label><label><span data-i18n="port"></span><input id="camPort" type="number" value="52381"></label><label id="serialPortField" class="hidden"><span>Porta COM / Serial</span><input id="camSerialPort" placeholder="COM3"></label><label id="baudRateField" class="hidden"><span>Baud rate</span><select id="camBaudRate"><option>9600</option><option>38400</option><option>115200</option></select></label></div><div id="authFields" class="formGrid"><label><span data-i18n="user"></span><input id="camUser"></label><label><span data-i18n="password"></span><input id="camPassword" type="password"></label></div><div class="ptzOptions"><label><span data-i18n="maxSpeed"></span><input id="camMaxSpeed" type="range" min="1" max="20" value="20"></label><label><span data-i18n="cameraPresetCount"></span><input id="camPresetCount" type="number" min="1" max="128" value="24"></label><label class="check"><input id="invertPan" type="checkbox"><span data-i18n="invertPan"></span></label><label class="check"><input id="invertTilt" type="checkbox"><span data-i18n="invertTilt"></span></label></div><button id="saveCamera" class="primary" data-i18n="saveCamera"></button></div></section>
<section id="aboutSettings" class="settingsPage"><div class="aboutHero"><img src="/cultoemoff-logo.svg" alt="Culto em Off"><div><h2>PTZ Control Web</h2><p data-i18n="aboutText"></p></div></div><p data-i18n="shareText"></p><div class="socials"><a href="https://www.instagram.com/cultoemoff/" target="_blank">Instagram</a><a href="https://www.youtube.com/@CultoemOff" target="_blank">YouTube</a><a href="https://github.com/CultoemOff/PTZ-Control-Dock/releases/latest" target="_blank" rel="noopener noreferrer">GitHub / Atualizações</a><button id="sharePlugin" class="primary" data-i18n="share"></button></div><p id="updateStatus" class="version">v0.5.0 • Culto em Off</p></section></dialog>
<dialog id="presetDialog"><h2 id="presetTitle"></h2><input id="presetName" maxlength="24"><div class="dialogActions"><button id="savePosition" class="primary" data-i18n="savePosition"></button><button id="clearPreset" class="danger" data-i18n="clearPreset"></button></div><button class="presetClose" data-i18n="cancel"></button></dialog>
</main><script src="/app.js"></script></body></html>
