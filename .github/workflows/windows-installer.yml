name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "installer/**"
      - "scripts/windows/**"
      - ".github/workflows/windows-installer.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build TypeScript
        run: npm run build
      - name: Prepare portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package\app\dist\web | Out-Null
          New-Item -ItemType Directory -Force package\runtime | Out-Null
          Copy-Item -Recurse -Force dist\* package\app\dist\
          Copy-Item -Recurse -Force src\web\* package\app\dist\web\
          Copy-Item package.json package\app\
          Copy-Item scripts\windows\start-server.vbs,scripts\windows\open-ptz.vbs package\
          Copy-Item "$env:ProgramFiles\nodejs\node.exe" package\runtime\node.exe
          Push-Location package\app
          npm install --omit=dev
          Pop-Location
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1)
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1)
            if (-not $iscc) {
              $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
            }
          }
          & $iscc installer\PTZ-Control-Web.iss
      - uses: actions/upload-artifact@v4
        with:
          name: PTZ-Control-Web-Setup
          path: installer/output/PTZ-Control-Web-Setup.exe
          if-no-files-found: error
